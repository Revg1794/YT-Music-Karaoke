<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YT Music Karaoke — Remote</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { overflow: auto; }
  #app { flex-direction: column; height: auto; min-height: 100vh; }
  #sidebar { width: 100%; height: auto; border-right: none; }
  #now-playing-readout {
    padding: 12px 16px;
    background: #131318;
    border-bottom: 1px solid #22222a;
    font-size: 13px;
    color: #8a8a99;
  }
  #now-playing-readout strong { color: #e8e8ec; }
  #now-playing-readout { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #skip-btn {
    flex-shrink: 0;
    background: #22222a;
    border: none;
    color: #e8e8ec;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #skip-btn:hover { background: #2c2c3a; }
  #guest-name {
    flex-shrink: 0;
    width: 100%;
    margin-bottom: 12px;
    padding: 8px 10px;
    background: #1e1e26;
    border: 1px solid #2c2c3a;
    border-radius: 8px;
    color: #e8e8ec;
    font-size: 13px;
  }
  #guest-name::placeholder { color: #6f6f7c; }
  #reactions {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: #131318;
    border-bottom: 1px solid #22222a;
  }
  #reactions button {
    flex: 1;
    background: #22222a;
    border: none;
    border-radius: 8px;
    font-size: 22px;
    padding: 8px 0;
    cursor: pointer;
  }
  #reactions button:hover { background: #2c2c3a; }
  #reactions button:active { transform: scale(0.92); }
</style>
</head>
<body>
  <div id="app">
    <div id="now-playing-readout">
      <span>Now playing: <strong id="now-playing-text">—</strong></span>
      <button id="skip-btn" title="Skip to next">⏭ Skip</button>
    </div>
    <div id="reactions">
      <button data-emoji="🎉">🎉</button>
      <button data-emoji="👏">👏</button>
      <button data-emoji="🔥">🔥</button>
      <button data-emoji="😂">😂</button>
      <button data-emoji="❤️">❤️</button>
    </div>
    <aside id="sidebar">
      <h1>Library</h1>
      <input id="guest-name" type="text" placeholder="Your name (shown on songs you add)" />
      <input id="search-box" type="text" placeholder="Loading library index…" disabled />
      <button id="queue-btn">🎵 Queue (0)</button>
      <div id="library-list">Loading…</div>
    </aside>
  </div>

  <script src="remote.js"></script>
</body>
</html>
