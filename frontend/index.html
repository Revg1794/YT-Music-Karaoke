<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>YT Music Karaoke</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Library</h1>
      <input id="search-box" type="text" placeholder="Loading library index…" disabled />
      <div id="header-row">
        <button id="queue-btn">🎵 Queue (0)</button>
        <button id="refresh-library-btn" title="Re-scan your YouTube Music library">⟳</button>
        <button id="help-btn" title="Show the quick tour">❓</button>
      </div>
      <div id="auth-banner" hidden>
        <div id="auth-message"></div>
        <button id="auth-reconnect-btn">Reconnect account</button>
      </div>
      <div id="host-lock" hidden>
        🔒 Host controls are locked on this screen.
        <button id="host-unlock-btn">Enter PIN</button>
      </div>
      <button id="recap-btn">🏆 Recap</button>
      <div id="party-info" hidden>
        📱 Guests: <a id="party-link" href="#" target="_blank"></a>
        <img id="party-qr" alt="QR code to join" />
      </div>
      <div id="library-list">Loading…</div>
    </aside>

    <main id="main">
      <div id="reaction-overlay"></div>

      <div id="lyrics-panel">
        <img id="album-art" hidden />
        <div id="lyrics-status">Pick a track from the library to start.</div>
        <div id="lyrics-lines"></div>
      </div>

      <div id="now-playing">
        <div id="track-info">
          <span id="track-title"></span>
          <span id="track-artist"></span>
        </div>
        <div id="controls">
          <button id="prev-btn" disabled title="Waiting for player to load…">⏮</button>
          <button id="play-btn" disabled title="Waiting for player to load…">▶</button>
          <button id="next-btn" disabled title="Waiting for player to load…">⏭</button>
          <select id="speed-select" title="Playback speed">
            <option value="1" selected>1x</option>
          </select>
          <button id="tv-mode-btn" title="TV mode">⛶</button>
          <button id="edit-lyrics-btn" title="Edit lyrics for this track">✎</button>
          <span id="lyric-offset" title="Lyric sync offset — [ and ] to nudge, 0 to reset" hidden></span>
        </div>
      </div>

      <div id="yt-player"></div>
    </main>

    <div id="lyrics-edit-overlay" hidden>
      <div id="lyrics-edit-box">
        <h2 id="lyrics-edit-title">Edit lyrics</h2>
        <p id="lyrics-edit-hint">
          Paste plain lyrics, or LRC-format synced lyrics (lines like
          <code>[01:23.45] some line</code>). Leave blank and save to clear an override and
          let auto-lookup run again.
        </p>
        <textarea id="lyrics-edit-textarea" spellcheck="false"></textarea>
        <div id="lyrics-edit-actions">
          <button id="lyrics-edit-cancel">Cancel</button>
          <button id="lyrics-edit-save">Save</button>
        </div>
      </div>
    </div>

    <div id="recap-overlay" hidden>
      <div id="recap-box">
        <h2>🏆 Tonight's Recap</h2>
        <div id="recap-list"></div>
        <button id="recap-close">Close</button>
      </div>
    </div>

    <div id="tour-tooltip" hidden>
      <div id="tour-text"></div>
      <div id="tour-actions">
        <button id="tour-skip">Skip</button>
        <button id="tour-next">Next</button>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
